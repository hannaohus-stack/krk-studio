    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:wght@400;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/assets/krk-site.css" />
    <style>
      html, body { height: 100%; }
      body { overflow: hidden; }

      .stage { position: relative; height: 100vh; height: 100svh; min-height: 720px; overflow: hidden; }

      .pager {
        position: absolute; z-index: 50; top: calc(52% - 281px); left: 50%;
        transform: translateX(-50%); display: flex; align-items: center; gap: 24px; width: 300px;
        color: var(--ink-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; pointer-events: none;
      }
      .pager::before { content: ""; height: 1px; flex: 1; background: var(--ink-muted); }

      .bg-mark { position: absolute; z-index: 1; left: 10%; top: 52%; transform: translateY(-50%); width: 744px; pointer-events: none; }
      .bg-mark img { width: 100%; height: auto; }

      .rail {
        position: absolute; z-index: 10; top: 52%; left: 0; right: 0; height: 394px; transform: translateY(-50%);
        perspective: 1400px; perspective-origin: 50% 50%; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab;
      }
      .rail.is-dragging { cursor: grabbing; }
      .rail:focus-visible { outline: 2px solid var(--ink); outline-offset: -6px; }
      .track { position: absolute; inset: 0; transform-style: preserve-3d; }
      .card {
        position: absolute; top: 0; left: 50%; width: 300px; margin-left: -150px; display: block;
        transform-origin: 50% 50%; will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden;
        transition: transform 640ms cubic-bezier(.22, 1, .36, 1), opacity 400ms ease;
      }
      .rail.is-dragging .card { transition: none; }
      .card .ph { aspect-ratio: 4 / 5.25; overflow: hidden; background: #181818; }
      .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }

      .stage-foot {
        position: absolute; z-index: 30; left: var(--pad); right: var(--pad); bottom: 28px;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
      }
      .stage-foot a { letter-spacing: 0.08em; text-transform: uppercase; }
      .stage-foot { padding-right: 150px; } /* room for the floating 문의하기 button */

      @media (max-width: 900px) {
        .stage { min-height: 600px; }
        .pager { top: 14%; width: 192px; }
        .bg-mark { left: 50%; top: 62.5%; transform: translateX(-50%); width: 292px; }
        .rail { top: 32.5%; height: 252px; transform: none; }
        .card { width: 192px; margin-left: -96px; }
        .stage-foot { left: 20px; right: 20px; bottom: 48px; padding-right: 0; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
        .stage-foot a { letter-spacing: 0.02em; text-transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <header class="site-header is-overlay">
        <nav aria-label="주 메뉴"><a href="/work/">Work</a></nav>
        <a class="logo" href="/" aria-label="KRK Studio 홈"><img src="/assets/krk-logo.svg" alt="krk" /></a>
        <nav aria-label="연락"><a href="#consult">Contact</a></nav>
        <button class="icon-btn menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" data-menu-open><span></span><span></span></button>
      </header>

      <div class="pager"><span aria-live="polite" data-pager>1 / 4</span></div>

      <div class="bg-mark" aria-hidden="true"><img src="/assets/krk-logo.svg" alt="" /></div>

      <div class="rail" tabindex="0" role="region" aria-roledescription="carousel" aria-label="케이스 스터디" data-rail>
        <div class="track" data-track></div>
      </div>

      <div class="stage-foot">
        <span>©KRK. All rights reserved.</span>
        <a href="https://www.instagram.com/director.ian.krk" target="_blank" rel="noopener">Instagram</a>
      </div>
    </main>

    <div class="menu-overlay" aria-hidden="true" data-menu>
      <div class="menu-top">
        <a href="/" aria-label="KRK Studio 홈"><img src="/assets/krk-logo.svg" alt="krk" /></a>
        <button class="icon-btn is-close" type="button" aria-label="메뉴 닫기" data-menu-close><span></span><span></span></button>
      </div>
      <nav aria-label="모바일 메뉴">
        <a href="/work/">Work</a>
        <a href="#consult">Contact</a>
      </nav>
      <div class="menu-foot">©KRK. All rights reserved.</div>
    </div>

    <script>
      (function () {
        var CASES = [
          { name: 'Balance B', img: '/assets/index-balanceb.png', link: '/work/case_balanceb.html' },
          { name: 'Mium', img: '/assets/index-mium.png', link: '/work/case_mium.html' },
          { name: 'UrbanPure', img: '/assets/index-urbanpure.png', link: '/work/case_urbanpure.html' },
          { name: 'ZZL', img: '/assets/index-zzl.png', link: '/work/case_zzl.html' }
        ];
        var last = CASES.length - 1;
        var rail = document.querySelector('[data-rail]');
        var track = document.querySelector('[data-track]');
        var pager = document.querySelector('[data-pager]');
        var mq = window.matchMedia('(max-width: 900px)');

        var cards = CASES.map(function (c, i) {
          var a = document.createElement('a');
          a.className = 'card';
          a.href = c.link;
          a.setAttribute('data-i', i);
          a.setAttribute('aria-label', c.name);
          a.draggable = false;
          a.innerHTML = '<div class="ph"><img src="' + c.img + '" alt="' + c.name + '" draggable="false"' + (i > 1 ? ' loading="lazy"' : '') + ' /></div>';
          track.appendChild(a);
          return a;
        });

        var index = 0, dragX = 0, dragging = false;

        // Reference coverflow rule, uncapped: [offset, rotateY, scale, z]
        var K = [[0, 0, 1.50, 100], [1, 34, 1.23, 47], [2, 89, 1.00, 0], [3, 120, 1.00, 0]];
        function kf(e) {
          var s = e < 0 ? -1 : 1, a = Math.abs(e), tx, ry, sc, z;
          if (a >= 3) { tx = a; ry = 120; sc = 1; z = 0; }
          else {
            var i = Math.floor(a), t = a - i, A = K[i], B = K[i + 1];
            tx = A[0] + (B[0] - A[0]) * t; ry = A[1] + (B[1] - A[1]) * t;
            sc = A[2] + (B[2] - A[2]) * t; z = A[3] + (B[3] - A[3]) * t;
          }
          return [tx * s, -ry * s, sc, z];
        }
        function base() { return mq.matches ? 192 : 300; }

        function render() {
          var BASE = base(), p = dragX / (BASE * 1.5);
          cards.forEach(function (el, i) {
            var e = (i - index) - p, v = kf(e), ae = Math.abs(e);
            el.style.transform = 'translate3d(' + (v[0] * BASE).toFixed(1) + 'px,0,0) rotateY(' + v[1].toFixed(2) + 'deg) scale(' + v[2].toFixed(3) + ')';
            el.style.zIndex = Math.round(v[3]) + 1;
            el.style.pointerEvents = ae < 1.5 ? 'auto' : 'none';
            el.setAttribute('aria-hidden', ae < 0.5 ? 'false' : 'true');
            el.tabIndex = ae < 0.5 ? 0 : -1;
          });
          pager.textContent = (index + 1) + ' / ' + CASES.length;
        }
        function go(dir) { index = Math.min(Math.max(index + dir, 0), last); dragX = 0; render(); }

        // Pointer: drag to move, tap side card to focus it, tap centre card to open.
        var sx = 0, st = 0, moved = false, pid = null, tap = null;
        rail.addEventListener('click', function (e) { if (e.target.closest('.card')) e.preventDefault(); });
        rail.addEventListener('pointerdown', function (e) {
          if (e.button > 0) return;
          var hit = e.target.closest('[data-i]');
          tap = hit ? Number(hit.getAttribute('data-i')) : null;
          sx = e.clientX; st = performance.now(); moved = false; pid = e.pointerId;
          try { rail.setPointerCapture(e.pointerId); } catch (_) {}
          dragging = true; dragX = 0; rail.classList.add('is-dragging');
        });
        rail.addEventListener('pointermove', function (e) {
          if (!dragging || e.pointerId !== pid) return;
          var dx = e.clientX - sx;
          if (Math.abs(dx) > 6) moved = true;
          if ((index === 0 && dx > 0) || (index === last && dx < 0)) dx *= 0.3;
          dragX = dx; render();
        });
        function end(e, cancelled) {
          if (!dragging) return;
          dragging = false; rail.classList.remove('is-dragging');
          var dx = cancelled ? 0 : e.clientX - sx;
          var v = dx / Math.max(performance.now() - st, 1);
          var W = base() * 1.5;
          if (!cancelled && !moved) {
            dragX = 0;
            if (tap !== null && tap !== index) { index = tap; render(); return; }
            render();
            if (tap !== null) window.location.href = CASES[tap].link;
            return;
          }
          if (!cancelled && (Math.abs(dx) > W * 0.18 || Math.abs(v) > 0.4)) go(dx < 0 ? 1 : -1);
          else { dragX = 0; render(); }
        }
        rail.addEventListener('pointerup', function (e) { end(e, false); });
        rail.addEventListener('pointercancel', function (e) { end(e, true); });

        rail.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
          if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
          if (e.key === 'Enter') { window.location.href = CASES[index].link; }
        });

        // Wheel / trackpad: one step per gesture.
        var acc = 0, lastWheel = 0, lockUntil = 0;
        window.addEventListener('wheel', function (e) {
          var now = performance.now();
          if (now - lastWheel > 220) acc = 0;
          lastWheel = now;
          if (now < lockUntil) return;
          var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          acc += d;
          if (Math.abs(acc) > 40) { var dir = acc > 0 ? 1 : -1; acc = 0; lockUntil = now + 700; go(dir); }
        }, { passive: true });

        (mq.addEventListener ? mq.addEventListener('change', render) : mq.addListener(render));
        render();
      })();
    </script>
    <script src="/assets/krk-site.js" defer></script>
    <script src="/consult-widget.js" defer></script>
  </body>
</html>
